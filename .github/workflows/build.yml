name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run build
      # upload-artifact は実行権限を残さないので、tar に固めて残す
      - run: tar -cf dist/vanish-linux-x64.tar -C dist vanish
      - uses: actions/upload-artifact@v5
        with:
          name: vanish-windows-x64
          path: dist/vanish.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: vanish-linux-x64
          path: dist/vanish-linux-x64.tar
          if-no-files-found: error
